[package]
name = "dev"
version = "0.1.0"
edition = "2024"
description = "Repository-level developer CLI for build automation"

[dependencies]
clap = { version = "*", features = ["derive"] }
tokio = { version = "*", features = ["full"] }
tokio-util = { version = "*", features = ["io"] }
serde_json = "*"
serde = { version = "*", features = ["derive"] }
bollard = "*"
futures-util = "*"
bytes = "*"
tar = "*"
walkdir = "*"
cargo_metadata = "*"
spinners = "*"
indicatif = "*"
owo-colors = "*"
indoc = "*"